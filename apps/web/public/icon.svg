<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="ss-ic-bg" cx="50%" cy="25%" r="80%">
      <stop offset="0%" stop-color="#26231C" />
      <stop offset="100%" stop-color="#0F0E0D" />
    </radialGradient>

    <!-- Solar Gold Gradients -->
    <linearGradient id="ss-ic-gold-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF38A" />
      <stop offset="45%" stop-color="#FFD439" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <linearGradient id="ss-ic-gold-mid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD439" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#D97706" stop-opacity="0.85" />
    </linearGradient>

    <linearGradient id="ss-ic-gold-bot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD439" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#B45309" stop-opacity="0.45" />
    </linearGradient>

    <!-- Emerald Pulse -->
    <linearGradient id="ss-ic-emerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <!-- Drop Shadows / Glow -->
    <filter id="ss-mark-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#FFD439" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base Icon Squircle Canvas -->
  <rect width="64" height="64" rx="16" fill="url(#ss-ic-bg)" />
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" stroke="#38342A" stroke-width="1.5" />

  <!-- The Architectural SteadyStack Emblem -->
  <g filter="url(#ss-mark-glow)" transform="translate(0, 0)">
    <!-- Stratum 3 (Base Foundation) -->
    <path d="M14 43L32 51.5L50 43L44.5 39.5L32 45.5L19.5 39.5L14 43Z" fill="url(#ss-ic-gold-bot)" />

    <!-- Stratum 2 (Quorum Intermediate) -->
    <path d="M14 33L32 41.5L50 33L44.5 29.5L32 35.5L19.5 29.5L14 33Z" fill="url(#ss-ic-gold-mid)" />

    <!-- Stratum 1 (Apex Monolith) -->
    <path d="M32 12.5L50 21L32 29.5L14 21L32 12.5Z" fill="#1C1A16" stroke="url(#ss-ic-gold-top)" stroke-width="2.5" stroke-linejoin="round" />

    <!-- Precision Edge Telemetry Track (Neon Laser Heartbeat) -->
    <path d="M20 21H25.5L28.5 15.5L32 26.5L35.5 17L38.5 22.5L40.5 21H44" stroke="url(#ss-ic-emerald)" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Quorum Consensus Core Beacon -->
    <circle cx="32" cy="26.5" r="1.75" fill="#34D399" />
  </g>
</svg>
