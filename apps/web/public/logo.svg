<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 52" fill="none">
  <defs>
    <!-- Solar Gold Gradients -->
    <linearGradient id="ss-lg-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF066" />
      <stop offset="50%" stop-color="#FFD439" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Emerald Pulse Gradient -->
    <linearGradient id="ss-lg-emerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <!-- Logo Mark Glow -->
    <filter id="ss-lg-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#FFD439" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- ICON EMBLEM (Left Side) -->
  <g transform="translate(6, 4)">
    <!-- Base Stratum Tier 3 -->
    <path d="M6 31L21 38.5L36 31L32 28L21 33.5L10 28L6 31Z" fill="url(#ss-lg-gold)" fill-opacity="0.4" />
    <!-- Mid Stratum Tier 2 -->
    <path d="M6 23.5L21 31L36 23.5L32 20.5L21 26L10 20.5L6 23.5Z" fill="url(#ss-lg-gold)" fill-opacity="0.8" />
    <!-- Apex Monolith Tier 1 -->
    <path d="M21 7L36 14.5L21 22L6 14.5L21 7Z" fill="#181715" stroke="url(#ss-lg-gold)" stroke-width="2.2" stroke-linejoin="round" filter="url(#ss-lg-glow)"/>
    <!-- Live Telemetry Heartbeat Track -->
    <path d="M12 14.5H16L18.5 10.5L21 19L23.5 11.5L25.5 16L27 14.5H30" stroke="url(#ss-lg-emerald)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="21" cy="19" r="1.3" fill="#34D399" />
  </g>

  <!-- TYPOGRAPHY (Right Side) -->
  <g transform="translate(54, 0)">
    <!-- Steady -->
    <text x="0" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Display', Roboto, sans-serif" font-size="24" font-weight="800" letter-spacing="-0.6px" fill="#FFFFFF">
      Steady
    </text>
    <!-- Stack -->
    <text x="79" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Display', Roboto, sans-serif" font-size="24" font-weight="800" letter-spacing="-0.6px" fill="url(#ss-lg-gold)">
      Stack
    </text>
    
    <!-- Version 2.0 Pill Badge -->
    <rect x="148" y="17" width="36" height="19" rx="5" fill="#23211A" stroke="#3D3A30" stroke-width="1" />
    <text x="155" y="30.5" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Display', Roboto, sans-serif" font-size="10" font-weight="800" fill="#FFD439" letter-spacing="0.5px">2.0</text>
  </g>
</svg>
