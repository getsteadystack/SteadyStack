name: Deploy

# Production deployment pipeline:
#
#   lock → deploy → smoke tests → (on failure) automatic rollback
#
# Deploys serialize on a Postgres advisory lock (scripts/deploy-lock.ts), so
# two merged PRs can't race each other onto production. Smoke tests gate the
# deployment: a failed critical check triggers automatic worker rollback and
# fails the run loudly.
#
# Staging deploys run the same pipeline against the `staging` stage —
# use workflow_dispatch with environment: staging.

on:
  # Manual deployments of any branch (explicit choice: nothing auto-deploys
  # production until the team opts into push-based deploys).
  workflow_dispatch:
    inputs:
      environment:
        description: "Target stage (prod | staging)"
        required: true
        default: "prod"
        type: choice
        options:
          - prod
          - staging
      skip-smoke:
        description: "Skip post-deploy smoke tests (emergencies only)"
        required: false
        default: false
        type: boolean

concurrency:
  # GitHub-side guard: cancel superseded queued runs for the same environment.
  # The advisory lock is the real serialization; this just reduces queue noise.
  group: deploy-${{ github.event.inputs.environment || 'prod' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  ALCHEMY_STAGE: ${{ github.event.inputs.environment || 'prod' }}

jobs:
  deploy:
    name: Deploy (${{ github.event.inputs.environment || 'prod' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
      DIRECT_URL: ${{ secrets.PROD_DIRECT_URL }}
      ALCHEMY_PASSWORD: ${{ secrets.ALCHEMY_PASSWORD }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
      CORS_ORIGIN: ${{ secrets.CORS_ORIGIN }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.6"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # ── 1. Deploy lock ────────────────────────────────────────────────────────
      - name: Acquire deploy lock
        run: bun scripts/deploy-lock.ts acquire --environment "$ALCHEMY_STAGE"

      - name: Start lock heartbeat
        run: |
          while true; do
            sleep 60
            bun scripts/deploy-lock.ts heartbeat --environment "$ALCHEMY_STAGE" || true
          done &
          echo "HEARTBEAT_PID=$!" >> "$GITHUB_ENV"

      # ── 2. Deploy (web + worker via alchemy, stage-scoped) ───────────────────
      - name: Deploy infrastructure
        id: deploy
        run: bunx alchemy deploy --stage "$ALCHEMY_STAGE"

      # ── 3. Capture the deployed worker version for rollback bookkeeping ──────
      - name: Record deployed worker version
        if: always() && steps.deploy.outcome == 'success'
        id: version
        run: |
          VERSION=$(bunx wrangler deployments status --config apps/worker/wrangler.jsonc 2>/dev/null \
            | grep -oP 'Version ID:\s*\K\w+' || true)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Deployed worker version: ${VERSION:-unknown}"

      # ── 4. Smoke tests (the rollback trigger) ────────────────────────────────
      - name: Run smoke tests
        id: smoke
        if: github.event.inputs.skip-smoke != 'true'
        run: |
          WEB_URL="${{ secrets.SMOKE_WEB_URL }}"
          WORKER_URL="${{ secrets.SMOKE_WORKER_URL }}"
          [ "$ALCHEMY_STAGE" = "staging" ] && WEB_URL="${{ secrets.STAGING_SMOKE_WEB_URL }}" && WORKER_URL="${{ secrets.STAGING_SMOKE_WORKER_URL }}"
          bun scripts/smoke-test.ts --web-url "$WEB_URL" --worker-url "$WORKER_URL"

      # ── 5a. Smoke passed → mark this version known-good ──────────────────────
      - name: Record known-good version
        if: steps.smoke.outcome == 'success' && steps.version.outputs.version != ''
        run: bun scripts/rollback-worker.ts record-good --version "${{ steps.version.outputs.version }}"

      # ── 5b. Smoke failed → automatic rollback ────────────────────────────────
      - name: Rollback worker (smoke test failure)
        id: rollback
        if: failure() && steps.smoke.outcome == 'failure' && steps.version.outputs.version != ''
        run: bun scripts/rollback-worker.ts --config apps/worker/wrangler.jsonc

      - name: Rollback summary
        if: always() && steps.rollback.outcome == 'success'
        run: |
          echo "::warning::Deployment failed smoke tests — worker rolled back to previous version. Web (Next.js) was NOT rolled back automatically; see alchemy state if it is also implicated."

      # ── 6. Always release the lock ────────────────────────────────────────────
      - name: Release deploy lock
        if: always()
        run: |
          [ -n "$HEARTBEAT_PID" ] && kill "$HEARTBEAT_PID" 2>/dev/null || true
          bun scripts/deploy-lock.ts release --environment "$ALCHEMY_STAGE"
