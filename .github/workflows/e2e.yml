name: E2E Tests

# Playwright end-to-end tests on every PR.
#
# Boots the full stack against an ephemeral Postgres:
#   1. Postgres service container
#   2. Prisma schema push
#   3. Next.js dev server (started by Playwright's webServer hook)
#   4. Critical-flow E2E: signup → create monitor → verify → delete
#
# Tests create and clean up their own data, so the database can be shared by
# concurrent CI runs safely (each run uses a unique timestamped email).

on:
  pull_request:
    branches: ["**"]

concurrency:
  group: e2e-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright critical flow
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: steadystack
          POSTGRES_PASSWORD: steadystack
          POSTGRES_DB: steadystack
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U steadystack -d steadystack"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://steadystack:steadystack@localhost:5432/steadystack
      DIRECT_URL: postgresql://steadystack:steadystack@localhost:5432/steadystack
      BETTER_AUTH_SECRET: e2e-ci-secret-at-least-32-characters-long!!
      BETTER_AUTH_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_WORKER_URL: http://127.0.0.1:8787
      CORS_ORIGIN: http://127.0.0.1:3000

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.6"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
        working-directory: apps/e2e

      - name: Push database schema
        run: bunx prisma db push --skip-generate
        working-directory: packages/db

      - name: Verify database connectivity
        run: bun apps/e2e/script-test-db.ts

      - name: Run Playwright tests
        run: bunx playwright test
        working-directory: apps/e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/e2e/playwright-report/
          retention-days: 7

      - name: Upload test traces on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: apps/e2e/test-results/
          retention-days: 7
